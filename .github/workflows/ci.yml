name: CI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
permissions:
  contents: read
  checks: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
env:
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        run: python3 scripts/ci.py scope
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: scope-${{ github.sha }}
          path: |
            test-results/
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: error
          retention-days: 14
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Record tested commit
        run: |
          mkdir -p test-results/ci
          git rev-parse HEAD > test-results/ci/tested-sha.txt
      - run: python3 scripts/ci.py docs 2>&1 | tee test-results/ci/docs.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: docs-${{ github.sha }}
          path: |
            test-results/
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: error
          retention-days: 14
  quality:
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Record tested commit
        run: |
          mkdir -p test-results/ci
          git rev-parse HEAD > test-results/ci/tested-sha.txt
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.8.0'
          python-version: '3.13.12'
          enable-cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.17.0'
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.23.0 --activate
          make install 2>&1 | tee test-results/ci/install.log
      - name: Quality gates
        run: make lint typecheck test contracts-check fixtures-check build 2>&1 | tee test-results/ci/quality-0.log
      - name: Browser dependencies
        run: pnpm --filter @yams/web exec playwright install --with-deps chromium 2>&1 | tee test-results/ci/quality-1.log
      - name: Browser checks
        run: make test-e2e 2>&1 | tee test-results/ci/quality-2.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: quality-${{ github.sha }}
          path: |
            test-results/
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: error
          retention-days: 14
  runtime:
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Record tested commit
        run: |
          mkdir -p test-results/ci
          git rev-parse HEAD > test-results/ci/tested-sha.txt
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.8.0'
          python-version: '3.13.12'
          enable-cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.17.0'
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.23.0 --activate
          make install 2>&1 | tee test-results/ci/install.log
      - name: Browser dependencies
        run: pnpm --filter @yams/web exec playwright install --with-deps chromium 2>&1 | tee test-results/ci/runtime-0.log
      - name: PostgreSQL integration
        run: make test-integration 2>&1 | tee test-results/ci/runtime-1.log
      - name: Offline Compose smoke
        run: make smoke 2>&1 | tee test-results/ci/runtime-2.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: runtime-${{ github.sha }}
          path: |
            test-results/
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: error
          retention-days: 14
  required:
    name: CI / required
    needs: [scope, docs, quality, runtime]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Record tested commit
        run: |
          mkdir -p test-results/ci
          git rev-parse HEAD > test-results/ci/tested-sha.txt
      - name: Require every applicable gate
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci.py required 2>&1 | tee test-results/ci/required.log
      - name: Verify current-head MergeWatch review
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_RUNTIME: ${{ needs.scope.outputs.runtime }}
        run: python3 scripts/review_gate.py 2>&1 | tee test-results/ci/review.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: required-${{ github.sha }}
          path: |
            test-results/
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: error
          retention-days: 14
