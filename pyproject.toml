[project]
name = "yams"
version = "0.0.4"
description = "Local, paper-only market simulation workspace"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic==1.20.1",
    "duckdb==2.0.0",
    "exchange-calendars==4.13.2",
    "fastapi==0.162.0",
    "numpy==2.5.4",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "pytz==2026.5",
    "sqlalchemy==2.1.6",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
research = [
    "yfinance==1.7.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.hatch.build.targets.sdist]
include = ["backend", "pyproject.toml", "uv.lock"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra --strict-markers -m 'not integration'"
markers = ["integration: isolated real PostgreSQL tests", "restart_verify: second-phase restart proof"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["backend", "scripts"]

[tool.uv]
required-version = "==0.8.0"

[dependency-groups]
benchmark = [
    "numpy==2.5.4",
]
dev = [
    "numpy==2.5.4",
    "httpx==0.28.1",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.17.3",
]
