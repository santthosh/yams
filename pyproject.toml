[project]
name = "yams"
version = "0.1.0"
description = "YAMS — Yet Another Market Simulator: a paper-money portfolio recommender"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pandas>=2.2",
    "numpy>=2.0",
    "pyarrow>=17",
    "yfinance>=0.2.50",
    "lxml>=5.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
